# 分类规则：自上而下匹配，正则作用于 "交易对方 商品描述" 拼接后的文本。
# LLM 兜底学到的新规则会写入 config/rules.learned.yaml（本文件优先级更高）。

categories:
  - 餐饮
  - 交通
  - 购物
  - 日用百货
  - 服饰美容
  - 娱乐
  - 旅行
  - 医疗健康
  - 教育学习
  - 居住
  - 水电网讯
  - 人情往来
  - 工资收入
  - 投资理财
  - 退款
