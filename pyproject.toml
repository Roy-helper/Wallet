[project]
name = "wallet"
version = "0.1.0"
description = "个人财务系统：账单导入、自动分类、月报与资产配置建议"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "flask>=3.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.50"]
dev = ["pytest>=8.0"]

[project.scripts]
wallet = "wallet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wallet*"]

[tool.setuptools.package-data]
wallet = ["templates/*.html"]
